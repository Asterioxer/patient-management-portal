<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ELRICS Patient Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <!-- Using a placeholder logo for now -->
                <img src="assets/logo.svg" alt="ELRICS Logo" class="login-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%232563eb\'><path d=\'M19,3H5C3.89,3 3,3.89 3,5V19C3,20.1 3.89,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.89 20.1,3 19,3M10,17V14H7V10H10V7L15,12L10,17Z\'/></svg>'">
                <h1 class="app-name">ELRICS Healthcare</h1>
                <p class="app-subtitle">Patient Management Portal</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username / Email</label>
                    <input type="text" id="username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div class="options-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe" style="color: var(--text-muted); cursor: pointer;">Remember me</label>
                    </div>
                    <a href="#" class="font-medium">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary login-btn">Sign In to Dashboard</button>
            </form>

            <div class="login-footer" style="margin-top: 1.5rem;">
                <div style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);">
                    <p style="margin-bottom: 0.5rem;">First time using the system?</p>
                    <a href="register.html" class="font-medium text-primary">Create Administrator Account</a>
                </div>
                <p>&copy; 2026 ELRICS Healthcare. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
